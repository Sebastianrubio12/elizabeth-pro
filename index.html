<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Elizabeth 💖</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #bfe3fc 0%, #fcd6e2 60%, #fedee8 100%);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Nubes y paisaje */
        .cloud-wrap { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .css-cloud { position: absolute; background: rgba(255, 255, 255, 0.85); border-radius: 100px; box-shadow: 0 4px 15px rgba(255, 255, 255, 0.4); animation: soft-sway 6s ease-in-out infinite alternate; }
        .css-cloud::before, .css-cloud::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.85); border-radius: 50%; }
        .cloud-1 { width: 130px; height: 40px; top: 6%; left: 5%; }
        .cloud-1::before { width: 50px; height: 50px; top: -24px; left: 18px; }
        .cloud-1::after { width: 65px; height: 65px; top: -34px; left: 50px; }
        .cloud-2 { width: 150px; height: 46px; top: 10%; right: 4%; animation-delay: -2s; }
        .cloud-2::before { width: 58px; height: 58px; top: -28px; left: 22px; }
        .cloud-2::after { width: 75px; height: 75px; top: -38px; left: 60px; }
        .cloud-3 { width: 110px; height: 35px; top: 22%; left: 12%; opacity: 0.75; animation-delay: -4s; }
        .cloud-3::before { width: 42px; height: 42px; top: -20px; left: 16px; }
        .cloud-3::after { width: 54px; height: 54px; top: -28px; left: 44px; }
        @keyframes soft-sway { 0% { transform: translateY(0); } 100% { transform: translateY(8px); } }

        .hill-back { position: fixed; bottom: -8vh; left: -15vw; width: 130vw; height: 30vh; background: #a9e2b4; border-radius: 50% 50% 0 0; z-index: 2; }
        .hill-front { position: fixed; bottom: -12vh; left: -20vw; width: 140vw; height: 26vh; background: #89ce99; border-radius: 50% 50% 0 0; z-index: 4; }

        .floating-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: hidden; }
        .floating-item { position: absolute; bottom: -40px; animation: floatUp linear infinite; will-change: transform, opacity; user-select: none; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 0; } 15% { opacity: 0.85; } 85% { opacity: 0.85; } 100% { transform: translateY(-115vh) scale(1.1) rotate(20deg); opacity: 0; } }

        /* Tarjeta */
        .card { background: rgba(255, 255, 255, 0.72); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 24px; padding: 2.2rem 1.8rem; width: 88%; max-width: 440px; text-align: center; box-shadow: 0 12px 35px rgba(120, 190, 140, 0.25), 0 4px 15px rgba(255, 182, 193, 0.25); z-index: 5; animation: fadeInCard 1s ease-out; position: relative; }
        @keyframes fadeInCard { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        
        h1 { font-family: 'Dancing Script', cursive; font-size: 2.9rem; margin-bottom: 0.8rem; background: linear-gradient(135deg, #c49635, #f5d47a, #b3821a, #f7de94); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 1px 1px 3px rgba(179, 130, 26, 0.15); }
        .quote-container { margin: 1.6rem 0; min-height: 100px; display: flex; align-items: center; justify-content: center; }
        #quote-text { font-size: 1.15rem; color: #4a3e42; line-height: 1.65; font-weight: 400; font-style: italic; }
        .date { font-size: 0.85rem; color: #a47614; font-weight: 600; margin-top: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px; }

        /* --- ANIMACIÓN PARA LA CAJITA DE REGALO --- */
        .gift-box {
            font-size: 5rem;
            cursor: pointer;
            display: inline-block;
            animation: shake 2s infinite;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.2s;
        }
        .gift-box:active { transform: scale(0.85); }
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            10%, 30%, 50%, 70%, 90% { transform: rotate(-8deg); }
            20%, 40%, 60%, 80% { transform: rotate(8deg); }
        }
        .instruction { font-size: 0.85rem; color: #888; margin-top: 15px; letter-spacing: 1px; text-transform: uppercase; font-weight: bold; }

        @media (max-width: 380px) { h1 { font-size: 2.3rem; } #quote-text { font-size: 1.05rem; } .card { padding: 1.5rem 1.2rem; } .hill-back { height: 24vh; } .hill-front { height: 20vh; } }
    </style>
</head>
<body>

    <div class="cloud-wrap">
        <div class="css-cloud cloud-1"></div>
        <div class="css-cloud cloud-2"></div>
        <div class="css-cloud cloud-3"></div>
    </div>

    <div class="hill-back"></div>
    <div class="floating-container" id="floating-container"></div>
    <div class="hill-front"></div>

        <div class="quote-container">
            <p id="quote-text">Buscando tu mensaje de hoy...</p>
        </div>
        <div class="date" id="current-date"></div>

            ];

                item.innerHTML = tipo.emoji;
                item.className = 'floating-item';
                item.style.fontSize = tipo.size;
                item.style.left = (Math.random() * 92 + 4) + '%';
                item.style.animationDelay = (Math.random() * 6) + 's';
                item.style.animationDuration = (6 + Math.random() * 6) + 's';
                
                container.appendChild(item);
            }
        }
