<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Elizabeth 💖</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            /* Cielo nocturno estrellado */
            background: linear-gradient(to bottom, #0b0f19 0%, #1a1525 50%, #3a1c31 100%);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- ESTRELLAS PARPADEANTES --- */
        #stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 5px #fff;
            animation: twinkle infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px #fff, 0 0 20px #fff; }
        }

        /* --- LUNA INTERACTIVA --- */
        #moon {
            position: fixed;
            top: 8%;
            right: 15%;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 30% 30%, #fffbd3, #fdf5a9);
            border-radius: 50%;
            box-shadow: 0 0 40px 10px rgba(253, 245, 169, 0.4), inset -10px -10px 20px rgba(0,0,0,0.1);
            z-index: 1;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        /* Efecto al tocar la luna */
        .moon-pulse {
            animation: moonGlow 1s ease-out;
        }
        @keyframes moonGlow {
            0% { transform: scale(1); box-shadow: 0 0 40px 10px rgba(253, 245, 169, 0.4); }
            50% { transform: scale(1.15); box-shadow: 0 0 80px 30px rgba(255, 255, 255, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 40px 10px rgba(253, 245, 169, 0.4); }
        }
        /* Pequeños cráteres en la luna */
        .crater { position: absolute; background: rgba(0,0,0,0.05); border-radius: 50%; }
        .c1 { width: 20px; height: 20px; top: 20px; left: 20px; }
        .c2 { width: 12px; height: 12px; top: 50px; left: 60px; }
        .c3 { width: 25px; height: 15px; top: 70px; left: 30px; transform: rotate(-20deg); }

        /* --- FLORES NEÓN CON PROFUNDIDAD --- */
        #garden-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60vh;
            pointer-events: none;
        }

        .flower-wrapper {
            position: absolute;
            bottom: -20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: bottom center;
            opacity: 0;
            animation: bloom 2s ease-out forwards, sway infinite alternate ease-in-out;
        }

        @keyframes bloom {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(var(--scale)); opacity: 1; }
        }
        @keyframes sway {
            0% { transform: scale(var(--scale)) rotate(-4deg); }
            100% { transform: scale(var(--scale)) rotate(4deg); }
        }

        /* Tallo y hojas */
        .stem-container {
            position: relative;
            display: flex;
            justify-content: center;
        }
        .stem {
            width: 4px;
            height: var(--stem-h);
            background: #ff5722;
            box-shadow: 0 0 12px 2px #ff5722;
            border-radius: 4px;
            margin-top: -10px;
        }
        .leaf {
            position: absolute;
            width: 12px;
            height: 25px;
            background: #ff5722;
            box-shadow: 0 0 10px 2px #ff5722;
            border-radius: 50% 0 50% 0;
        }
        .leaf.left { left: -10px; top: 40%; transform: rotate(-45deg); }
        .leaf.right { right: -10px; top: 60%; transform: rotate(45deg); }

        /* Cabeza de la flor */
        .flower-head {
            position: relative;
            width: 40px;
            height: 40px;
            z-index: 2;
        }
        .petal {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 30px;
            background: #ffc107;
            border-radius: 50%;
            transform-origin: 50% 100%;
            margin-left: -5px;
            margin-top: -30px;
            box-shadow: 0 0 15px 3px #ff9800, 0 0 5px 1px #ffeb3b inset;
        }
        .petal:nth-child(1) { transform: rotate(0deg); } .petal:nth-child(2) { transform: rotate(45deg); }
        .petal:nth-child(3) { transform: rotate(90deg); } .petal:nth-child(4) { transform: rotate(135deg); }
        .petal:nth-child(5) { transform: rotate(180deg); } .petal:nth-child(6) { transform: rotate(225deg); }
        .petal:nth-child(7) { transform: rotate(270deg); } .petal:nth-child(8) { transform: rotate(315deg); }
        
        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px 8px #ffeb3b;
            z-index: 3;
        }

        /* --- TARJETA PRINCIPAL --- */
        .card { 
            background: rgba(20, 15, 30, 0.6); 
            -webkit-backdrop-filter: blur(12px); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 24px; 
            padding: 2.5rem 2rem; 
            width: 90%; 
            max-width: 460px; 
            text-align: center; 
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 193, 7, 0.1); 
            z-index: 10; 
            animation: fadeInCard 1.5s ease-out; 
            position: relative; 
        }
        @keyframes fadeInCard { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        h1 { font-family: 'Dancing Script', cursive; font-size: 3.2rem; margin-bottom: 1rem; background: linear-gradient(135deg, #f5d47a, #ffffff, #f7de94); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 15px rgba(245, 212, 122, 0.3); }
        .quote-container { margin: 1.8rem 0; min-height: 100px; display: flex; align-items: center; justify-content: center; }
        #quote-text { font-size: 1.2rem; color: #e6e0e9; line-height: 1.7; font-weight: 300; font-style: italic; letter-spacing: 0.5px; }
        .date { font-size: 0.85rem; color: #f5d47a; font-weight: 600; margin-top: 1rem; text-transform: uppercase; letter-spacing: 2px; }

        /* --- BOTÓN DE MÚSICA --- */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 18px;
            border-radius: 30px;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @media (max-width: 380px) { h1 { font-size: 2.6rem; } #quote-text { font-size: 1.1rem; } .card { padding: 1.8rem 1.5rem; } #moon { width: 70px; height: 70px; right: 10%; } }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="evangeline.mp3" type="audio/mpeg">
    </audio>

    <div id="music-control" class="music-btn">🎵 Activar música</div>

    <div id="stars-container"></div>
    
    <div id="moon" onclick="pulseMoon()">
        <div class="crater c1"></div>
        <div class="crater c2"></div>
        <div class="crater c3"></div>
    </div>

    <div id="garden-container"></div>

    <div class="card">
        <h1 id="main-title">Para Elizabeth</h1>
        <div class="quote-container">
            <p id="quote-text">Buscando tu mensaje de hoy...</p>
        </div>
        <div class="date" id="current-date"></div>
    </div>

    <script>
        const frases = [
            "Eres la leche de mi Milo, el complemento perfecto que le da sabor a todos mis días.",
            "Si nuestra historia fuera un libro, ni la misma Virginia P. Leon podría escribir algo tan hermoso.",
            "Sé que serás la ingeniera más brillante de todas. Estoy muy orgulloso de verte crecer cada día.",
            "Eres mi 'lobster'. A mi vida le haces tanto bien como el café a Central Perk en Friends.",
            "He visto 14 millones de futuros al estilo Doctor Strange, y en todos los que soy feliz estoy contigo.",
            "Un día frío es la excusa perfecta del universo para llenarte de besos y darte mil abrazos más.",
            "Mi mayor sueño es construir esa hermosa familia que tanto queremos y apoyarte en cada meta.",
            "Ni todos los girasoles, rosas y tulipanes de un jardín igualan lo mucho que floreces cada día.",
            "Me atrapaste desde el primer día. Ni Spiderman hace redes tan fuertes como las que nos unen.",
            "Contigo aprendí lo que es la verdadera responsabilidad afectiva; eres mi lugar seguro.",
            "No hay obra de arte en ningún museo del mundo que me guste mirar más que a ti.",
            "Tú, yo, cobijitas, el clima frío y maratón de Big Bang Theory. Mi plan perfecto.",
            "Me haces más feliz que un buen plato de frijoles con chicharrón de cerdo. ¡Eres mi sazón!",
            "Admiro muchísimo tu hambre de superación personal. Vas a llegar más lejos de lo que imaginas.",
            "Como dirían en My Little Pony: la magia de la amistad es linda, pero nuestro amor es invencible.",
            "Tú eres el pollo de mi arroz y la leche de mi Milo. ¡El toque exacto que hace todo mejor!",
            "Te prometo llenarte de cumplidos cada día, porque mereces que te recuerden lo espectacular que eres.",
            "Cada vez que te veo sonreír, siento que estoy caminando por un campo de tulipanes y rosas.",
            "Mi ingeniera favorita: me encanta ver cómo diseñas y construyes el camino hacia tus sueños.",
            "Tener a alguien con tanta responsabilidad afectiva me hace el hombre más afortunado del mundo.",
            "Eres mi Penny, pero con el cerebro de Sheldon y Leonard juntos. ¡Mi ingeniera perfecta!",
            "Amo pasear contigo, ya sea descubriendo un museo nuevo o simplemente tomados de la mano.",
            "Quiero ser ese abrazo que te quite el frío y ese beso que borre cualquier preocupación del día.",
            "Mi meta de superación personal todos los días es ser un hombre digno de la mujer increíble que eres.",
            "Si el amor fuera un libro de Virginia P. Leon, tú serías el capítulo que nunca quiero terminar.",
            "Me emociona pensar en nuestra futura familia. Sé que serás una madre y una profesional extraordinaria.",
            "Eres la Mary Jane de este Peter Parker, la razón por la que siempre quiero ser un héroe para ti.",
            "Contigo cualquier tarde de frío viendo capítulos repetidos de Friends es el paraíso en la tierra.",
            "Mis cumplidos se quedan cortos para describir tu magia. Eres mi universo entero.",
            "Prometo cuidarte, abrazarte y amarte hasta que estemos viejitos comiendo frijoles juntos.",
            "Eres la Monica de mi Chandler, ¡el complemento perfecto! Mi ingeniera, mi amor, mi todo."
        ];

        // Lógica de música
        const musicBtn = document.getElementById('music-control');
        const bgMusic = document.getElementById('bg-music');
        let isPlaying = false;
        musicBtn.addEventListener('click', () => {
            if (isPlaying) { bgMusic.pause(); musicBtn.innerHTML = '🎵 Activar música'; } 
            else { bgMusic.play(); musicBtn.innerHTML = '🎶 Pausar música'; }
            isPlaying = !isPlaying;
        });

        // Interacción de la luna
        function pulseMoon() {
            const moon = document.getElementById('moon');
            moon.classList.remove('moon-pulse');
            void moon.offsetWidth; // Reinicia la animación
            moon.classList.add('moon-pulse');
        }

        // Generar Estrellas
        function crearEstrellas() {
            const container = document.getElementById('stars-container');
            for (let i = 0; i < 70; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = (Math.random() * 3 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                star.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(star);
            }
        }

        // Generar Flores en Capas para dar Profundidad 3D
        function crearJardinConProfundidad() {
            const container = document.getElementById('garden-container');
            
            // Capa 1: Fondo (Más pequeñas, borrosas, oscuras)
            // Capa 2: Medio (Tamaño normal)
            // Capa 3: Frente (Grandes y brillantes)
            const capas = [
                { cantidad: 15, escalaMin: 0.3, escalaMax: 0.5, blur: '3px', z: 2, talloMin: 100, talloMax: 150, delayMax: 5 },
                { cantidad: 12, escalaMin: 0.6, escalaMax: 0.8, blur: '1px', z: 4, talloMin: 140, talloMax: 200, delayMax: 4 },
                { cantidad: 8,  escalaMin: 0.9, escalaMax: 1.2, blur: '0px', z: 6, talloMin: 180, talloMax: 250, delayMax: 3 }
            ];

            capas.forEach(capa => {
                for (let i = 0; i < capa.cantidad; i++) {
                    const flower = document.createElement('div');
                    flower.className = 'flower-wrapper';
                    flower.style.left = (Math.random() * 96) + '%';
                    flower.style.zIndex = capa.z;
                    flower.style.filter = `blur(${capa.blur})`;
                    
                    const escala = capa.escalaMin + Math.random() * (capa.escalaMax - capa.escalaMin);
                    flower.style.setProperty('--scale', escala);
                    flower.style.animationDelay = (Math.random() * capa.delayMax) + 's';
                    flower.style.animationDuration = (4 + Math.random() * 4) + 's';

                    const altoTallo = capa.talloMin + Math.random() * (capa.talloMax - capa.talloMin);

                    flower.innerHTML = `
                        <div class="flower-head">
                            <div class="petal"></div><div class="petal"></div>
                            <div class="petal"></div><div class="petal"></div>
                            <div class="petal"></div><div class="petal"></div>
                            <div class="petal"></div><div class="petal"></div>
                            <div class="center"></div>
                        </div>
                        <div class="stem-container">
                            <div class="leaf left"></div>
                            <div class="stem" style="--stem-h: ${altoTallo}px;"></div>
                            <div class="leaf right"></div>
                        </div>
                    `;
                    container.appendChild(flower);
                }
            });
        }

        function mostrarFraseDelDia() {
            const hoy = new Date();
            const semilla = hoy.getFullYear() + hoy.getMonth() + hoy.getDate();
            const indiceFrase = semilla % frases.length;

            document.getElementById('quote-text').innerText = `"${frases[indiceFrase]}"`;
            
            const opcionesFecha = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').innerText = hoy.toLocaleDateString('es-ES', opcionesFecha);
        }

        window.onload = () => {
            mostrarFraseDelDia();
            crearEstrellas();
            crearJardinConProfundidad();
        };
    </script>
</body>
</html>
