<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Elizabeth 💖</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #ffd1df 0%, #b85c8e 50%, #2c1024 100%);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- JARDÍN DE FLORES BRILLANTES (CSS Puro) --- */
        #garden-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45vh;
            z-index: 2;
            pointer-events: none;
        }

        .css-flower-wrapper {
            position: absolute;
            bottom: -20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: bottom center;
            animation: bloom-flower 2s ease-out forwards, sway 5s ease-in-out infinite alternate 2s;
            opacity: 0;
        }

        @keyframes bloom-flower {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(var(--scale)); opacity: 1; }
        }

        @keyframes sway {
            0% { transform: rotate(-6deg); }
            100% { transform: rotate(6deg); }
        }

        .stem {
            width: 3px;
            height: 180px;
            background: #ff6b9e;
            box-shadow: 0 0 12px 2px #ff6b9e;
            border-radius: 4px;
            margin-top: -15px;
        }

        .css-flower-head {
            position: relative;
            width: 50px;
            height: 50px;
            z-index: 2;
        }

        .petal {
            position: absolute;
            top: 0;
            left: 21px; 
            width: 8px;
            height: 35px;
            background: #fff;
            border-radius: 50% 50% 20% 20%;
            transform-origin: bottom center;
            box-shadow: 0 0 10px 2px #ff1493, 0 0 25px 5px #ff69b4;
        }

        .petal:nth-child(1) { transform: rotate(0deg); }
        .petal:nth-child(2) { transform: rotate(45deg); }
        .petal:nth-child(3) { transform: rotate(90deg); }
        .petal:nth-child(4) { transform: rotate(135deg); }
        .petal:nth-child(5) { transform: rotate(180deg); }
        .petal:nth-child(6) { transform: rotate(225deg); }
        .petal:nth-child(7) { transform: rotate(270deg); }
        .petal:nth-child(8) { transform: rotate(315deg); }
        
        .center {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 20px;
            height: 20px;
            background: #fff066;
            border-radius: 50%;
            box-shadow: 0 0 20px 8px #ffb700, inset 0 0 5px #d4af37;
            z-index: 3;
        }

        /* --- PARTÍCULAS BRILLANTES FLOTANTES --- */
        #particles-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .particle {
            position: absolute;
            bottom: -10px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px 3px #ffb700;
            animation: floatUp 8s linear infinite;
        }
        @keyframes floatUp { 
            0% { transform: translateY(0) scale(0.5); opacity: 0; } 
            20% { opacity: 0.8; } 
            80% { opacity: 0.8; } 
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; } 
        }

        /* --- TARJETA PRINCIPAL --- */
        .card { 
            background: rgba(255, 255, 255, 0.65); 
            -webkit-backdrop-filter: blur(16px); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.8); 
            border-radius: 24px; 
            padding: 2.5rem 2rem; 
            width: 90%; 
            max-width: 460px; 
            text-align: center; 
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2); 
            z-index: 5; 
            animation: fadeInCard 1.5s ease-out; 
            position: relative; 
        }
        @keyframes fadeInCard { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        h1 { font-family: 'Dancing Script', cursive; font-size: 3.2rem; margin-bottom: 1rem; background: linear-gradient(135deg, #c49635, #f5d47a, #b3821a, #f7de94); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 1px 1px 3px rgba(179, 130, 26, 0.2); }
        .quote-container { margin: 1.8rem 0; min-height: 100px; display: flex; align-items: center; justify-content: center; }
        #quote-text { font-size: 1.2rem; color: #3a2e32; line-height: 1.7; font-weight: 500; font-style: italic; text-shadow: 0px 0px 1px rgba(255,255,255,0.5); }
        .date { font-size: 0.9rem; color: #a47614; font-weight: 600; margin-top: 1rem; text-transform: uppercase; letter-spacing: 1.5px; }

        @media (max-width: 380px) { h1 { font-size: 2.6rem; } #quote-text { font-size: 1.1rem; } .card { padding: 1.8rem 1.5rem; } }
    </style>
</head>
<body>

    <div id="particles-container"></div>
    <div id="garden-container"></div>

    <div class="card">
        <h1 id="main-title">Para Elizabeth</h1>
        <div class="quote-container">
            <p id="quote-text">Buscando tu mensaje de hoy...</p>
        </div>
        <div class="date" id="current-date"></div>
    </div>

    <script>
        const frases = [
            "Eres la leche de mi Milo, el complemento perfecto que le da sabor a todos mis días.",
            "Si nuestra historia fuera un libro, ni la misma Virginia P. Leon podría escribir algo tan hermoso.",
            "Sé que serás la ingeniera más brillante de todas. Estoy muy orgulloso de verte crecer cada día.",
            "Eres mi 'lobster'. A mi vida le haces tanto bien como el café a Central Perk en Friends.",
            "He visto 14 millones de futuros al estilo Doctor Strange, y en todos los que soy feliz estoy contigo.",
            "Un día frío es la excusa perfecta del universo para llenarte de besos y darte mil abrazos más.",
            "Mi mayor sueño es construir esa hermosa familia que tanto queremos y apoyarte en cada meta.",
            "Ni todos los girasoles, rosas y tulipanes de un jardín igualan lo mucho que floreces cada día.",
            "Me atrapaste desde el primer día. Ni Spiderman hace redes tan fuertes como las que nos unen.",
            "Contigo aprendí lo que es la verdadera responsabilidad afectiva; eres mi lugar seguro.",
            "No hay obra de arte en ningún museo del mundo que me guste mirar más que a ti.",
            "Tú, yo, cobijitas, el clima frío y maratón de Big Bang Theory. Mi plan perfecto.",
            "Me haces más feliz que un buen plato de frijoles con chicharrón de cerdo. ¡Eres mi sazón!",
            "Admiro muchísimo tu hambre de superación personal. Vas a llegar más lejos de lo que imaginas.",
            "Como dirían en My Little Pony: la magia de la amistad es linda, pero nuestro amor es invencible.",
            "Tú eres el pollo de mi arroz y la leche de mi Milo. ¡El toque exacto que hace todo mejor!",
            "Te prometo llenarte de cumplidos cada día, porque mereces que te recuerden lo espectacular que eres.",
            "Cada vez que te veo sonreír, siento que estoy caminando por un campo de tulipanes y rosas.",
            "Mi ingeniera favorita: me encanta ver cómo diseñas y construyes el camino hacia tus sueños.",
            "Tener a alguien con tanta responsabilidad afectiva me hace el hombre más afortunado del mundo.",
            "Eres mi Penny, pero con el cerebro de Sheldon y Leonard juntos. ¡Mi ingeniera perfecta!",
            "Amo pasear contigo, ya sea descubriendo un museo nuevo o simplemente tomados de la mano.",
            "Quiero ser ese abrazo que te quite el frío y ese beso que borre cualquier preocupación del día.",
            "Mi meta de superación personal todos los días es ser un hombre digno de la mujer increíble que eres.",
            "Si el amor fuera un libro de Virginia P. Leon, tú serías el capítulo que nunca quiero terminar.",
            "Me emociona pensar en nuestra futura familia. Sé que serás una madre y una profesional extraordinaria.",
            "Eres la Mary Jane de este Peter Parker, la razón por la que siempre quiero ser un héroe para ti.",
            "Contigo cualquier tarde de frío viendo capítulos repetidos de Friends es el paraíso en la tierra.",
            "Mis cumplidos se quedan cortos para describir tu magia. Eres mi universo entero.",
            "Prometo cuidarte, abrazarte y amarte hasta que estemos viejitos comiendo frijoles juntos.",
            "Eres la Monica de mi Chandler, ¡el complemento perfecto! Mi ingeniera, mi amor, mi todo."
        ];

        function crearJardinBrillante() {
            const container = document.getElementById('garden-container');
            const totalFlores = 14;

            for (let i = 0; i < totalFlores; i++) {
                const flower = document.createElement('div');
                flower.className = 'css-flower-wrapper';
                flower.style.left = (Math.random() * 94 + 2) + '%';
                flower.style.setProperty('--scale', 0.4 + Math.random() * 0.7);
                flower.style.animationDelay = (Math.random() * 3) + 's';
                flower.innerHTML = `
                    <div class="css-flower-head">
                        <div class="petal"></div><div class="petal"></div>
                        <div class="petal"></div><div class="petal"></div>
                        <div class="petal"></div><div class="petal"></div>
                        <div class="petal"></div><div class="petal"></div>
                        <div class="center"></div>
                    </div>
                    <div class="stem"></div>
                `;
                container.appendChild(flower);
            }
        }

        function crearParticulas() {
            const container = document.getElementById('particles-container');
            for(let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.width = (Math.random() * 4 + 2) + 'px';
                p.style.height = p.style.width;
                p.style.animationDuration = (8 + Math.random() * 10) + 's';
                p.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(p);
            }
        }

        function mostrarFraseDelDia() {
            const hoy = new Date();
            const año = hoy.getFullYear();
            const mes = hoy.getMonth(); 
            const dia = hoy.getDate();  

            const quoteText = document.getElementById('quote-text');
            const currentDate = document.getElementById('current-date');
            
            const opcionesFecha = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };

            // Calculo normal del día a día (limpio, sin sorpresa de cumpleaños)
            const semilla = año + mes + dia;
            const indiceFrase = semilla % frases.length;

            quoteText.innerText = `"${frases[indiceFrase]}"`;
            currentDate.innerText = hoy.toLocaleDateString('es-ES', opcionesFecha);
        }

        window.onload = () => {
            mostrarFraseDelDia();
            crearJardinBrillante();
            crearParticulas();
        };
    </script>
</body>
</html>
