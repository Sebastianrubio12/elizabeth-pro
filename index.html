            <!-- Pantaloncito marron -->
            <path class="character-outline" d="M60 150h60l-6 40-24 2-24-2z" fill="#9c5a2e"/>
            <path class="character-line" d="M90 152v38" fill="none"/>
            <!-- Brazos -->
            <path class="character-line" d="M64 120l-16 16M116 120l16 16" fill="none"/>

            <p id="quote-text">Buscando tu mensaje de hoy...</p>
