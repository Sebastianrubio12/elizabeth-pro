<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Elizabeth 💖</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            /* Cielo degradado entre azul pastel y rosa suave */
            background: linear-gradient(180deg, #bfe3fc 0%, #fcd6e2 60%, #fedee8 100%);
            height: 100vh;
            height: 100dvh; /* Para Safari en iPhone y Chrome en Android */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- NUBES ESTÁTICAS (Estilo dibujo / CSS puro) --- */
        .cloud-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .css-cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 100px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.4);
            animation: soft-sway 6s ease-in-out infinite alternate;
        }

        .css-cloud::before,
        .css-cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
        }

        /* Nube 1: Superior Izquierda */
        .cloud-1 {
            width: 130px;
            height: 40px;
            top: 6%;
            left: 5%;
        }
        .cloud-1::before {
            width: 50px;
            height: 50px;
            top: -24px;
            left: 18px;
        }
        .cloud-1::after {
            width: 65px;
            height: 65px;
            top: -34px;
            left: 50px;
        }

        /* Nube 2: Superior Derecha */
        .cloud-2 {
            width: 150px;
            height: 46px;
            top: 10%;
            right: 4%;
            animation-delay: -2s;
        }
        .cloud-2::before {
            width: 58px;
            height: 58px;
            top: -28px;
            left: 22px;
        }
        .cloud-2::after {
            width: 75px;
            height: 75px;
            top: -38px;
            left: 60px;
        }

        /* Nube 3: Mediana Izquierda */
        .cloud-3 {
            width: 110px;
            height: 35px;
            top: 22%;
            left: 12%;
            opacity: 0.75;
            animation-delay: -4s;
        }
        .cloud-3::before {
            width: 42px;
            height: 42px;
            top: -20px;
            left: 16px;
        }
        .cloud-3::after {
            width: 54px;
            height: 54px;
            top: -28px;
            left: 44px;
        }

        @keyframes soft-sway {
            0% { transform: translateY(0); }
            100% { transform: translateY(8px); }
        }

        /* --- COLINAS DE JARDÍN --- */
        .hill-back {
            position: fixed;
            bottom: -8vh;
            left: -15vw;
            width: 130vw;
            height: 30vh;
            background: #a9e2b4;
            border-radius: 50% 50% 0 0;
            z-index: 2;
        }

        .hill-front {
            position: fixed;
            bottom: -12vh;
            left: -20vw;
            width: 140vw;
            height: 26vh;
            background: #89ce99;
            border-radius: 50% 50% 0 0;
            z-index: 4;
        }

        /* --- ELEMENTOS FLOTANTES (GIRASOLES Y CORAZONES) --- */
        .floating-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            overflow: hidden;
        }

        .floating-item {
            position: absolute;
            bottom: -40px;
            animation: floatUp linear infinite;
            will-change: transform, opacity;
            user-select: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 0.85;
            }
            85% {
                opacity: 0.85;
            }
            100% {
                transform: translateY(-115vh) scale(1.1) rotate(20deg);
                opacity: 0;
            }
        }

        /* --- TARJETA PRINCIPAL (GLASSMORPHISM) --- */
        .card {
            background: rgba(255, 255, 255, 0.72);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            padding: 2.2rem 1.8rem;
            width: 88%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(120, 190, 140, 0.25), 0 4px 15px rgba(255, 182, 193, 0.25);
            z-index: 5;
            animation: fadeInCard 1s ease-out;
            position: relative;
        }

        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.9rem;
            margin-bottom: 0.8rem;
            background: linear-gradient(135deg, #c49635, #f5d47a, #b3821a, #f7de94);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 1px 1px 3px rgba(179, 130, 26, 0.15);
        }

        .quote-container {
            margin: 1.6rem 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #quote-text {
            font-size: 1.15rem;
            color: #4a3e42;
            line-height: 1.65;
            font-weight: 400;
            font-style: italic;
        }

        .date {
            font-size: 0.85rem;
            color: #a47614;
            font-weight: 600;
            margin-top: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Ajustes para pantallas pequeñas (iPhone SE / celulares compactos) */
        @media (max-width: 380px) {
            h1 { font-size: 2.3rem; }
            #quote-text { font-size: 1.05rem; }
            .card { padding: 1.5rem 1.2rem; }
            .hill-back { height: 24vh; }
            .hill-front { height: 20vh; }
        }
    </style>
</head>
<body>

    <!-- NUBES ESTÁTICAS E ILUSTRADAS -->
    <div class="cloud-wrap">
        <div class="css-cloud cloud-1"></div>
        <div class="css-cloud cloud-2"></div>
        <div class="css-cloud cloud-3"></div>
    </div>

    <!-- COLINAS DEL JARDÍN -->
    <div class="hill-back"></div>
    <div class="floating-container" id="floating-container"></div>
    <div class="hill-front"></div>

    <!-- TARJETA CON LA FRASE -->
    <div class="card">
        <h1>Para Elizabeth</h1>
        <div class="quote-container">
            <p id="quote-text">Buscando tu mensaje de hoy...</p>
        </div>
        <div class="date" id="current-date"></div>
    </div>

    <script>
        const frases = [
            "Buenos días, mi amor. Hoy es un lienzo en blanco, llénalo de colores.",
            "Eres mi inspiración diaria, Elizabeth. ¡Que tengas un día maravilloso!",
            "Tu sonrisa tiene el poder de iluminar hasta el día más gris. Nunca dejes de sonreír.",
            "Hoy eres más fuerte, más inteligente y más hermosa que ayer. ¡Creo en ti!",
            "No importa los retos que traiga el día, recuerda que estoy a tu lado.",
            "Que hoy te pasen cosas tan hermosas como los sentimientos que provocas en mí.",
            "Eres magia pura, Elizabeth. Sal y cómete el mundo hoy.",
            "Buenos días a la mujer que hace que mi realidad sea mejor que mis sueños.",
            "Cada nuevo amanecer es una excusa más para recordarte lo mucho que te amo.",
            "Tu luz ilumina mi vida entera. Que este día sea tan brillante como tú.",
            "Respira profundo, confía en ti y da lo mejor. Eres capaz de lograr todo lo que te propongas.",
            "Mi parte favorita del día es saber que formas parte de mi vida.",
            "Detrás de ti hay un poder infinito, y a tu lado, alguien que siempre te apoyará.",
            "Hoy es un día perfecto para ser feliz. ¡Disfrútalo al máximo, mi amor!",
            "Admiro tu fuerza, tu inteligencia y tu corazón. ¡Que tengas un día increíble!",
            "Nunca olvides lo especial que eres para mí y para el mundo.",
            "Que la alegría te acompañe desde tu primer café hasta que vuelvas a casa.",
            "Eres el 'buenos días' que siempre quiero leer y la sonrisa que siempre quiero ver.",
            "No dejes que nada ni nadie apague ese brillo dorado que te caracteriza.",
            "Si el día se pone difícil, recuerda cuánto te amo y todo lo que hemos superado.",
            "Me haces querer ser una mejor persona cada día. Gracias por existir, Elizabeth.",
            "Que la vida te sorprenda hoy con pequeños detalles que te hagan inmensamente feliz.",
            "Eres mi pensamiento al despertar y mi paz al ir a dormir. ¡Feliz día!",
            "Confío plenamente en tu talento. Ve por tus metas hoy, yo te aplaudo desde aquí.",
            "Tu belleza exterior es increíble, pero tu belleza interior es lo que me vuelve loco.",
            "Aprovecha este nuevo día para brillar con tu luz propia.",
            "Siempre serás mi lugar favorito en el mundo. ¡Que te vaya excelente hoy!",
            "Tómate un momento para ti hoy, respira y recuerda lo mucho que vales.",
            "Eres mi persona favorita. Que tu día esté lleno de bendiciones y sonrisas.",
            "Te envío un abrazo virtual enorme para que empieces el día con toda la energía.",
            "Elizabeth, no hay límites para lo que puedes lograr. Eres increíble."
        ];

        function mostrarFraseDelDia() {
            const hoy = new Date();
            const año = hoy.getFullYear();
            const mes = hoy.getMonth(); 
            const dia = hoy.getDate(); 

            const semilla = año + mes + dia;
            const indiceFrase = semilla % frases.length;

            document.getElementById('quote-text').innerText = `"${frases[indiceFrase]}"`;

            const opcionesFecha = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').innerText = hoy.toLocaleDateString('es-ES', opcionesFecha);
        }

        // Generador mixto: Girasoles + Corazones románticos
        function crearElementosFlotantes() {
            const container = document.getElementById('floating-container');
            const simbolos = [
                { emoji: '🌻', size: '1.9rem' },
                { emoji: '🌻', size: '2.1rem' },
                { emoji: '🤍', size: '1.3rem' },
                { emoji: '💕', size: '1.4rem' },
                { emoji: '🌸', size: '1.3rem' }
            ];

            const total = 14;
            for(let i = 0; i < total; i++) {
                const item = document.createElement('div');
                const tipo = simbolos[Math.floor(Math.random() * simbolos.length)];
                
                item.innerHTML = tipo.emoji;
                item.className = 'floating-item';
                item.style.fontSize = tipo.size;
                item.style.left = (Math.random() * 92 + 4) + '%';
                item.style.animationDelay = (Math.random() * 6) + 's';
                item.style.animationDuration = (6 + Math.random() * 6) + 's';
                
                container.appendChild(item);
            }
        }

        window.onload = () => {
            mostrarFraseDelDia();
            crearElementosFlotantes();
        };
    </script>
</body>
</html>
