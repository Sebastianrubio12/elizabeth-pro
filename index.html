<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Elizabeth 💖</title>
    <!-- Enlace al archivo de estilos externos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- =========================================
         ELEMENTOS DE AUDIO
         ========================================= -->
    <!-- Música de fondo que se reproduce en bucle -->
    <audio id="bg-music" loop>
        <source src="evangeline.mp3" type="audio/mpeg">
    </audio>

    <!-- Botón para controlar la reproducción de música -->
    <div id="music-control" class="music-btn">🎵 Activar música</div>

    <!-- =========================================
         ELEMENTOS DE FONDO (DISEÑO VISUAL TIPO PAPEL/ACUARELA)
         ========================================= -->
    <!-- Contenedor para la animación de la flor pintándose -->
    <div id="flower-drawing-container">
        <svg id="rose-svg" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
            <!-- Tallo y Hojas -->
            <path class="rose-path stem" d="M 50 140 Q 45 100 55 60" fill="transparent" stroke="#5a8b5e" stroke-width="2" stroke-linecap="round"/>
            <path class="rose-path leaf" d="M 50 110 Q 30 115 40 95 Q 50 100 50 110" fill="transparent" stroke="#5a8b5e" stroke-width="1.5"/>
            <path class="rose-path leaf" d="M 52 90 Q 70 85 60 70 Q 50 80 52 90" fill="transparent" stroke="#5a8b5e" stroke-width="1.5"/>

            <!-- Pétalos de la rosa -->
            <g class="rose-petals" stroke="#e06e88" stroke-width="1.5" fill="transparent">
                <!-- Pétalos externos -->
                <path class="rose-path petal" d="M 55 60 C 20 60, 20 30, 45 25 C 50 20, 60 20, 65 25 C 90 30, 90 60, 55 60 Z"/>
                <!-- Pétalos medios -->
                <path class="rose-path petal" d="M 55 55 C 30 50, 35 30, 50 28 C 65 30, 80 50, 55 55 Z"/>
                <!-- Pétalo central / capullo -->
                <path class="rose-path petal" d="M 55 48 C 45 45, 45 35, 52 32 C 60 35, 65 45, 55 48 Z"/>
                <!-- Detalles internos -->
                <path class="rose-path petal" d="M 45 25 Q 55 40 65 25"/>
            </g>
        </svg>
    </div>

    <!-- =========================================
         CONTENIDO PRINCIPAL (TARJETA TIPO PAPEL)
         ========================================= -->
    <div class="card">
        <!-- Título principal -->
        <h1 id="main-title">Para Elizabeth</h1>

        <!-- Contenedor para la frase romántica del día -->
        <div class="quote-container">
            <p id="quote-text">Buscando tu mensaje de hoy...</p>
        </div>

        <!-- Contenedor para mostrar la fecha actual -->
        <div class="date" id="current-date"></div>
    </div>

    <!-- Enlace al archivo de JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
