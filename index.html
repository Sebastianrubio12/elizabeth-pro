<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Elizabeth 💖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Gloria+Hallelujah&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bg-music" loop>
        <source src="evangeline.mp3" type="audio/mpeg">
    </audio>

    <div id="music-control" class="music-btn">🎵 Activar música</div>

    <div id="sky-container">
        <svg id="sun-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle class="crayon-stroke sun-core" cx="50" cy="50" r="20" fill="transparent" stroke="#FFCA28" stroke-width="4" stroke-dasharray="4 2"/>
            <path class="crayon-stroke sun-ray" d="M 50 15 L 50 5" stroke="#FFCA28" stroke-width="4" stroke-linecap="round"/>
            <path class="crayon-stroke sun-ray" d="M 50 85 L 50 95" stroke="#FFCA28" stroke-width="4" stroke-linecap="round"/>
            <path class="crayon-stroke sun-ray" d="M 15 50 L 5 50" stroke="#FFCA28" stroke-width="4" stroke-linecap="round"/>
            <path class="crayon-stroke sun-ray" d="M 85 50 L 95 50" stroke="#FFCA28" stroke-width="4" stroke-linecap="round"/>
            <path class="crayon-stroke sun-ray" d="M 25 25 L 18 18" stroke="#FFCA28" stroke-width="4" stroke-linecap="round"/>
            <path class="crayon-stroke sun-ray" d="M 75 75 L 82 82" stroke="#FFCA28" stroke-width="4" stroke-linecap="round"/>
            <path class="crayon-stroke sun-ray" d="M 25 75 L 18 82" stroke="#FFCA28" stroke-width="4" stroke-linecap="round"/>
            <path class="crayon-stroke sun-ray" d="M 75 25 L 82 18" stroke="#FFCA28" stroke-width="4" stroke-linecap="round"/>
        </svg>

        <svg class="cloud-svg" style="left: 10%; top: 15%;" viewBox="0 0 150 100" xmlns="http://www.w3.org/2000/svg">
            <path class="crayon-stroke cloud-path" d="M 40 60 C 20 60, 20 40, 40 40 C 45 20, 80 20, 90 40 C 110 35, 120 50, 110 65 C 120 80, 90 85, 80 80 C 60 90, 35 80, 40 60 Z" fill="transparent" stroke="#81D4FA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 4"/>
        </svg>

        <svg class="cloud-svg" style="right: 15%; top: 25%; left: auto;" viewBox="0 0 150 100" xmlns="http://www.w3.org/2000/svg">
            <path class="crayon-stroke cloud-path" d="M 40 60 C 20 60, 20 40, 40 40 C 45 20, 80 20, 90 40 C 110 35, 120 50, 110 65 C 120 80, 90 85, 80 80 C 60 90, 35 80, 40 60 Z" fill="transparent" stroke="#81D4FA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 3"/>
        </svg>
    </div>

    <div class="notebook-paper">
        <img class="character character-chopper" src="Chopper.png" alt="Chopper" aria-hidden="true">
        <img class="character character-kitty" src="Hello%20Kitty.png" alt="Hello Kitty" aria-hidden="true">
        <img class="character character-ladybug" src="Marinette.png" alt="Ladybug" aria-hidden="true">
        <img class="character character-luffy" src="Luffy.png" alt="Luffy" aria-hidden="true">
        <h1 id="main-title">Para Elizabeth</h1>
        <div class="quote-container">
            <p id="quote-text">Buscando tu mensaje de hoy...</p>
        </div>
        <div class="date" id="current-date"></div>
    </div>

    <div id="garden-container">

        <svg class="tulip-svg" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet">
            <path class="crayon-stroke stem" d="M 50 150 Q 55 100 50 60" fill="transparent" stroke="#7CB342" stroke-width="4" stroke-linecap="round"/>

                <!-- Base / U-shape -->
                <path class="crayon-stroke petal" d="M 35 30 C 35 65, 65 65, 65 30 C 58 45, 55 45, 50 35 C 45 45, 42 45, 35 30 Z"/>

                <path class="crayon-stroke petal" d="M 50 60 L 50 35"/>

            <path class="crayon-stroke leaf" d="M 50 110.0 Q 30 115.0 40 95.0 Q 50 100.0 50 110.0" fill="transparent" stroke="#7CB342" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

                <!-- Center spike -->

            </g>
        </svg>

</body>
